name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
      JWT_SECRET: ci-only-secret-never-used-in-the-running-service-123456
      DATABASE_URL: sqlite:///${{ runner.temp }}/migration-check.db
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Ruff
        run: python -m ruff check .
      - name: Migrations on a new SQLite database
        run: python -m alembic upgrade head
      - name: Tests
        run: python -m pytest -q
