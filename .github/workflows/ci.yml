name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
      JWT_SECRET: ci-only-secret-never-used-in-the-running-service-123456
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Migrations on a new SQLite database
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/migration-check.db
        run: python -m alembic upgrade head
      - name: Tests
        run: python -m pytest -v
      - name: Upload project source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cinema-club-tracker-source
          if-no-files-found: error
          retention-days: 7
          # Only the explicitly listed hidden files are included.
          include-hidden-files: true
          path: |
            app_final.py
            app/**/*.py
            migrations/**/*.py
            migrations/script.py.mako
            alembic.ini
            test_app.py
            conftest.py
            tests/**/*.py
            requirements.txt
            requirements-dev.txt
            requirements.lock
            pyproject.toml
            README.md
            TECHNICAL_SPECIFICATION.md
            .env.example
            .gitignore
            .github/workflows/ci.yml
